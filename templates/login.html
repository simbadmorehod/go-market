{% extends "base.html" %}
{% block content %}
<div class="login">
  <h1>Supplier login</h1>
  {% if err %}<p class="err">{{ err }}</p>{% endif %}
  <form method="post" action="/partner/login">
    <input type="text" name="username" placeholder="Login" autocapitalize="none" required>
    <input type="password" name="password" placeholder="Password" required>
    <button class="btn primary big" type="submit">Enter</button>
  </form>
</div>
{% endblock %}
